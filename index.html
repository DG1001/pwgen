                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Generate Password

    <!-- Update banner (hidden until a new service worker is waiting) -->
    <div id="update-banner" class="hidden fixed inset-x-0 bottom-0 p-4 flex justify-center" role="status" aria-live="polite">
        <div class="bg-gray-900 text-white text-sm rounded-xl shadow-lg px-4 py-3 flex items-center gap-4 max-w-md w-full">
            <span class="flex-1">A new version is available.</span>
            <button id="update-btn" type="button" class="bg-blue-500 hover:bg-blue-600 px-3 py-1.5 rounded-lg font-medium transition-colors">Update</button>
            <button id="update-dismiss" type="button" class="text-gray-400 hover:text-white transition-colors">Later</button>
        </div>
    </div>

    <script>
        'use strict';

        /* ------------------------------------------------------------------
         * Service worker registration + update flow
         * ------------------------------------------------------------------ */
        const updateBanner = document.getElementById('update-banner');
        const updateBtn = document.getElementById('update-btn');
        const updateDismiss = document.getElementById('update-dismiss');

        function setupServiceWorker() {
            if (!('serviceWorker' in navigator)) return;

            // Relative path: keeps the app working under a sub-path such as
            // https://user.github.io/pwgen/ where '/sw.js' would 404.
            navigator.serviceWorker.register('sw.js').then((registration) => {
                let waitingWorker = registration.waiting || null;

                function promptForUpdate(worker) {
                    waitingWorker = worker;
                    updateBanner.classList.remove('hidden');
                }

                // A worker may already be waiting from a previous visit.
                if (registration.waiting && navigator.serviceWorker.controller) {
                    promptForUpdate(registration.waiting);
                }

                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    if (!newWorker) return;
                    newWorker.addEventListener('statechange', () => {
                        // controller check: on a first-ever install there is
                        // nothing to update *from*, so stay silent.
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            promptForUpdate(newWorker);
                        }
                    });
                });

                updateBtn.addEventListener('click', () => {
                    updateBanner.classList.add('hidden');
                    // Without this the new worker stays in 'waiting' forever and
                    // a plain reload would change nothing.
                    if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
                });

                updateDismiss.addEventListener('click', () => {
                    updateBanner.classList.add('hidden');
                });
            }).catch((err) => {
                console.warn('ServiceWorker registration failed:', err);
            });

            // The new worker took over -> reload once to pick up the new assets.
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloading) return;
                reloading = true;
                window.location.reload();
            });
        }

        /* ------------------------------------------------------------------
         * Cryptographically secure randomness
         *
         * Math.random() is a non-cryptographic PRNG whose internal state can be
         * recovered from a handful of outputs - unusable for secrets.
         * ------------------------------------------------------------------ */
        const cryptoObj = window.crypto || window.msCrypto;
        const hasSecureRandom = !!(cryptoObj && typeof cryptoObj.getRandomValues === 'function');

        // Uniform integer in [0, max) via rejection sampling (no modulo bias).
        function randomInt(max) {
            if (!Number.isInteger(max) || max < 1 || max > 0x100000000) {
                throw new RangeError('randomInt: max out of range');
            }
            const buf = new Uint32Array(1);
            // Largest multiple of `max` that fits in a uint32; anything at or
            // above it would over-represent the low values, so we resample.
            const limit = Math.floor(0x100000000 / max) * max;
            let value;
            do {
                cryptoObj.getRandomValues(buf);
                value = buf[0];
            } while (value >= limit);
            return value % max;
        }

        function randomChar(chars) {
            return chars.charAt(randomInt(chars.length));
        }

        function randomItem(list) {
            return list[randomInt(list.length)];
        }

        // Fisher-Yates with a CSPRNG source.
        function shuffleString(str) {
            const array = str.split('');
            for (let i = array.length - 1; i > 0; i--) {
                const j = randomInt(i + 1);
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array.join('');
        }

        /* ------------------------------------------------------------------
         * Data files
         * ------------------------------------------------------------------ */
        const WORDLIST_URLS = {
            english: 'words/en.txt',
            german: 'words/de.txt'
        };
        const SENTENCE_URLS = {
            english: 'words/sentence-en.json',
            german: 'words/sentence-de.json'
        };
        const wordListCache = {};
        const sentenceCache = {};

        // Diceware word lists: 7776 words = 12.92 bits per word.
        async function loadWordList(language) {
            if (wordListCache[language]) return wordListCache[language];

            const response = await fetch(WORDLIST_URLS[language]);
            if (!response.ok) {
                throw new Error('Could not load the word list');
            }
            const words = (await response.text())
                .split('\n')
                .map((word) => word.trim())
                .filter(Boolean);

            if (words.length < 1000) {
                throw new Error('Word list looks incomplete');
            }
            wordListCache[language] = words;
            return words;
        }

        // Sentence building blocks, indexed by the initial letter of each word.
        // The password is made of those initials, so the letter is what has to
        // be drawn uniformly - drawing words uniformly instead would bias the
        // password towards letters that happen to start many words.
        async function loadSentenceData(language) {
            if (sentenceCache[language]) return sentenceCache[language];

            const response = await fetch(SENTENCE_URLS[language]);
            if (!response.ok) {
                throw new Error('Could not load the sentence data');
            }
            const data = await response.json();

            const index = {};
            Object.keys(data.slots).forEach((slot) => {
                const byLetter = {};
                data.slots[slot].forEach((word) => {
                    const letter = word.charAt(0);
                    if (!byLetter[letter]) byLetter[letter] = [];
                    byLetter[letter].push(word);
                });
                index[slot] = byLetter;
            });

            const prepared = { templates: data.templates, index: index };
            sentenceCache[language] = prepared;
            return prepared;
        }

        /* ------------------------------------------------------------------
         * Character pools
         * ------------------------------------------------------------------ */
        const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
        const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const DIGITS = '0123456789';
        const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        // Pronounceable syllables: onset + nucleus + coda, each drawn uniformly
        // from its own table. An empty coda gives an open syllable.
        const SYLLABLE_ONSETS = [
            'b', 'c', 'd', 'f', 'g', 'h', 'j', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'w', 'z',
            'bl', 'br', 'ch', 'cl', 'cr', 'dr', 'fl', 'fr', 'gl', 'gr', 'kl', 'kr', 'pl', 'pr',
            'sc', 'sh', 'sk', 'sl', 'sm', 'sn', 'sp', 'st', 'sw', 'th', 'tr', 'tw', 'wh',
            'shr', 'spl', 'spr', 'str', 'thr'
        ];
        // Used when the previous syllable ended in a consonant. Without this,
        // a coda like 'rd' followed by an onset like 'thr' produces "rdthr" -
        // five consonants in a row, which defeats the point of the mode. The
        // empty entry gives a vowel-initial syllable, which only ever follows
        // a consonant and so never creates a vowel pile-up either.
        const SYLLABLE_ONSETS_SIMPLE = [
            '', 'b', 'c', 'd', 'f', 'g', 'j', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'v', 'w', 'z'
        ];
        const SYLLABLE_NUCLEI = [
            'a', 'e', 'i', 'o', 'u',
            'ai', 'au', 'ay', 'ea', 'ee', 'ei', 'eo', 'ia', 'ie', 'io',
            'oa', 'oo', 'ou', 'ow', 'oy', 'ue', 'ui'
        ];
        const SYLLABLE_CODAS = [
            '',
            'b', 'd', 'f', 'g', 'k', 'l', 'm', 'n', 'p', 'r', 's', 't', 'x',
            'ck', 'ld', 'lk', 'll', 'lm', 'lp', 'lt', 'mp', 'nd', 'ng', 'nk', 'nt',
            'rd', 'rk', 'rl', 'rm', 'rn', 'rt', 'sh', 'sk', 'sp', 'ss', 'st', 'th'
        ];

        // Letters that have a digit lookalike. Applied as an independent coin
        // flip per eligible position, which is what makes it worth entropy at
        // all - a fixed a->4 mapping an attacker can replay adds exactly zero.
        const LEET_MAP = {
            a: '4', b: '8', e: '3', g: '9', i: '1',
            l: '1', o: '0', s: '5', t: '7', z: '2'
        };

        function applyLeet(text) {
            const chars = text.split('');
            let bits = 0;

            for (let i = 0; i < chars.length; i++) {
                const replacement = LEET_MAP[chars[i].toLowerCase()];
                if (!replacement) continue;
                bits += 1;
                if (randomInt(2) === 1) chars[i] = replacement;
            }
            return { text: chars.join(''), bits: bits };
        }

        function capitalize(word) {
            return word.charAt(0).toUpperCase() + word.slice(1);
        }

        /* ------------------------------------------------------------------
         * Icons (inline SVG - no runtime icon library, works offline)
         * ------------------------------------------------------------------ */
        const ICON_REFRESH = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>';
        const ICON_LOADER = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
        const ICON_COPY = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
        const ICON_CHECK = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>';

        /* ------------------------------------------------------------------
         * DOM elements
         * ------------------------------------------------------------------ */
        const passwordOutput = document.getElementById('password-output');
        const copyBtn = document.getElementById('copy-btn');
        const copyFeedback = document.getElementById('copy-feedback');
        const strengthBar = document.getElementById('strength-bar');
        const strengthLabel = document.getElementById('strength-label');
        const mnemonicHint = document.getElementById('mnemonic-hint');
        const mnemonicSentence = document.getElementById('mnemonic-sentence');
        const generateBtn = document.getElementById('generate-btn');

        const randomBtn = document.getElementById('random-btn');
        const syllableBtn = document.getElementById('syllable-btn');
        const passphraseBtn = document.getElementById('passphrase-btn');
        const mnemonicBtn = document.getElementById('mnemonic-btn');

        const randomSettings = document.getElementById('random-settings');
        const syllableSettings = document.getElementById('syllable-settings');
        const passphraseSettings = document.getElementById('passphrase-settings');
        const mnemonicSettings = document.getElementById('mnemonic-settings');

        const lengthSlider = document.getElementById('length-slider');
        const lengthValue = document.getElementById('length-value');
        const uppercaseCheck = document.getElementById('uppercase');
        const lowercaseCheck = document.getElementById('lowercase');
        const numbersCheck = document.getElementById('numbers');
        const symbolsCheck = document.getElementById('symbols');

        const syllableLength = document.getElementById('syllable-length');
        const syllableLengthValue = document.getElementById('syllable-length-value');
        const syllableCaps = document.getElementById('syllable-caps');
        const syllableLeet = document.getElementById('syllable-leet');
        const syllableNumber = document.getElementById('syllable-number');
        const syllableSymbol = document.getElementById('syllable-symbol');

        const wordCountSlider = document.getElementById('word-count');
        const wordCountValue = document.getElementById('word-count-value');
        const separatorSelect = document.getElementById('separator');
        const passphraseCaps = document.getElementById('passphrase-caps');
        const passphraseLeet = document.getElementById('passphrase-leet');
        const addNumberCheck = document.getElementById('add-number');
        const languageRadios = document.querySelectorAll('input[name="language"]');

        const mnemonicLength = document.getElementById('mnemonic-length');
        const mnemonicLengthValue = document.getElementById('mnemonic-length-value');
        const mnemonicLeet = document.getElementById('mnemonic-leet');
        const mnemonicNumber = document.getElementById('mnemonic-number');
        const mnemonicLanguageRadios = document.querySelectorAll('input[name="mnemonic-language"]');

        let currentGenerationType = 'random';

        /* ------------------------------------------------------------------
         * Mode switching
         * ------------------------------------------------------------------ */
        const modes = {
            random: { button: randomBtn, panel: randomSettings },
            syllable: { button: syllableBtn, panel: syllableSettings },
            passphrase: { button: passphraseBtn, panel: passphraseSettings },
            mnemonic: { button: mnemonicBtn, panel: mnemonicSettings }
        };

        function selectMode(mode) {
            currentGenerationType = mode;

            Object.keys(modes).forEach((name) => {
                const entry = modes[name];
                const active = name === mode;

                entry.button.setAttribute('aria-pressed', String(active));
                if (active) {
                    entry.button.classList.remove('text-gray-500', 'hover:text-gray-700');
                    entry.button.classList.add('bg-white', 'shadow-sm');
                } else {
                    entry.button.classList.remove('bg-white', 'shadow-sm');
                    entry.button.classList.add('text-gray-500', 'hover:text-gray-700');
                }
                entry.panel.classList.toggle('hidden', !active);
            });
        }

        function selectedValue(radios) {
            for (const radio of radios) {
                if (radio.checked) return radio.value;
            }
            return 'english';
        }

        function initEventListeners() {
            const sliders = [
                [lengthSlider, lengthValue],
                [syllableLength, syllableLengthValue],
                [wordCountSlider, wordCountValue],
                [mnemonicLength, mnemonicLengthValue]
            ];
            sliders.forEach(([slider, output]) => {
                slider.addEventListener('input', () => {
                    output.textContent = slider.value;
                });
            });

            Object.keys(modes).forEach((mode) => {
                modes[mode].button.addEventListener('click', () => selectMode(mode));
            });

            generateBtn.addEventListener('click', generatePassword);
            copyBtn.addEventListener('click', copyToClipboard);

            selectMode('random');
        }

        /* ------------------------------------------------------------------
         * Generation
         * ------------------------------------------------------------------ */
        async function generatePassword() {
            if (!hasSecureRandom) {
                passwordOutput.textContent = 'Secure randomness unavailable in this browser';
                showStrength(null);
                showSentence(null);
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = ICON_LOADER + ' Generating...';

            try {
                let result;
                switch (currentGenerationType) {
                    case 'syllable':
                        result = generateSyllablePassword();
                        break;
                    case 'passphrase':
                        result = await generatePassphrase();
                        break;
                    case 'mnemonic':
                        result = await generateMnemonic();
                        break;
                    default:
                        result = generateRandomPassword();
                }
                passwordOutput.textContent = result.password;
                showStrength(result.entropy);
                showSentence(result.sentence || null);
            } catch (error) {
                passwordOutput.textContent = error.message;
                copyFeedback.textContent = '';
                showStrength(null);
                showSentence(null);
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = ICON_REFRESH + ' Generate Password';
            }
        }

        function generateRandomPassword() {
            const length = parseInt(lengthSlider.value, 10);

            const selectedTypes = [
                uppercaseCheck.checked ? UPPERCASE : '',
                lowercaseCheck.checked ? LOWERCASE : '',
                numbersCheck.checked ? DIGITS : '',
                symbolsCheck.checked ? SYMBOLS : ''
            ].filter(Boolean);

            if (selectedTypes.length === 0) {
                throw new Error('Please select at least one character type');
            }

            const charset = selectedTypes.join('');
            let password = '';

            // One character from every selected type, then fill up.
            selectedTypes.forEach((type) => {
                password += randomChar(type);
            });
            for (let i = password.length; i < length; i++) {
                password += randomChar(charset);
            }

            return {
                password: shuffleString(password),
                entropy: password.length * Math.log2(charset.length)
            };
        }

        function generateSyllablePassword() {
            const total = parseInt(syllableLength.value, 10);
            const useCaps = syllableCaps.checked;
            const useLeet = syllableLeet.checked;
            const useNumber = syllableNumber.checked;
            const useSymbol = syllableSymbol.checked;

            // The trailing number/symbol count towards the requested length,
            // so the slider keeps meaning what it says.
            const suffixLength = (useNumber ? 2 : 0) + (useSymbol ? 1 : 0);
            const target = Math.max(4, total - suffixLength);

            const syllables = [];
            let built = 0;
            let previousCoda = '';

            while (built < target) {
                // The onset table depends on how the previous syllable ended,
                // so the bit count is per syllable rather than a constant.
                const onsets = previousCoda ? SYLLABLE_ONSETS_SIMPLE : SYLLABLE_ONSETS;
                const onset = randomItem(onsets);
                const nucleus = randomItem(SYLLABLE_NUCLEI);
                const coda = randomItem(SYLLABLE_CODAS);

                syllables.push({
                    text: onset + nucleus + coda,
                    bits: Math.log2(onsets.length)
                        + Math.log2(SYLLABLE_NUCLEI.length)
                        + Math.log2(SYLLABLE_CODAS.length)
                });
                built += onset.length + nucleus.length + coda.length;
                previousCoda = coda;
            }

            let text = '';
            let entropy = 0;
            for (const syllable of syllables) {
                const remaining = target - text.length;
                if (remaining <= 0) break;

                const kept = syllable.text.slice(0, remaining);
                // A syllable cut short only contributed part of its choices.
                entropy += syllable.bits * (kept.length / syllable.text.length);

                if (useCaps) {
                    // One fair coin per syllable, so this is worth a full bit
                    // whichever way it lands.
                    entropy += 1;
                    text += randomInt(2) === 1 ? capitalize(kept) : kept;
                } else {
                    text += kept;
                }
            }

            if (useLeet) {
                const leeted = applyLeet(text);
                text = leeted.text;
                entropy += leeted.bits;
            }

            if (useNumber) {
                text += String(randomInt(90) + 10);
                entropy += Math.log2(90);
            }
            if (useSymbol) {
                text += randomChar(SYMBOLS);
                entropy += Math.log2(SYMBOLS.length);
            }

            return { password: text, entropy: entropy };
        }

        async function generatePassphrase() {
            const wordCount = parseInt(wordCountSlider.value, 10);
            const separator = separatorSelect.value;
            const useCaps = passphraseCaps.checked;
            const useLeet = passphraseLeet.checked;
            const addNumber = addNumberCheck.checked;

            const words = await loadWordList(selectedValue(languageRadios));
            const parts = [];
            for (let i = 0; i < wordCount; i++) {
                const word = randomItem(words);
                parts.push(useCaps ? capitalize(word) : word);
            }

            // Capitalising is deterministic, so it adds no entropy - it is
            // there for readability and for sites that demand a capital.
            let entropy = wordCount * Math.log2(words.length);
            let password = parts.join(separator);

            if (useLeet) {
                const leeted = applyLeet(password);
                password = leeted.text;
                entropy += leeted.bits;
            }

            if (addNumber) {
                password += separator + String(randomInt(90) + 10);
                entropy += Math.log2(90);
            }

            return { password: password, entropy: entropy };
        }

        async function generateMnemonic() {
            const wordCount = parseInt(mnemonicLength.value, 10);
            const useLeet = mnemonicLeet.checked;
            const addNumber = mnemonicNumber.checked;

            const data = await loadSentenceData(selectedValue(mnemonicLanguageRadios));
            const template = data.templates[String(wordCount)];
            if (!template) {
                throw new Error('No sentence template for that length');
            }

            const words = [];
            let entropy = 0;

            for (const slot of template) {
                const byLetter = data.index[slot];
                const letters = Object.keys(byLetter);
                // Uniform over initials, then over the words behind that
                // initial - the initial is what ends up in the password.
                const letter = randomItem(letters);
                entropy += Math.log2(letters.length);
                words.push(randomItem(byLetter[letter]));
            }

            words[0] = capitalize(words[0]);
            const sentence = words.join(' ') + '.';
            let password = words.map((word) => word.charAt(0)).join('');

            if (useLeet) {
                const leeted = applyLeet(password);
                password = leeted.text;
                entropy += leeted.bits;
            }

            if (addNumber) {
                password += String(randomInt(90) + 10);
                entropy += Math.log2(90);
            }

            return { password: password, entropy: entropy, sentence: sentence };
        }

        /* ------------------------------------------------------------------
         * Strength estimate
         *
         * Entropy of the *generation process*, i.e. how much work an attacker
         * who knows this exact algorithm and all its settings has to do. That
         * is the honest number - it is not a guess based on the characters
         * that happened to come out.
         * ------------------------------------------------------------------ */
        const STRENGTH_LEVELS = [
            { min: 80, label: 'Very strong', bar: 'bg-emerald-600', text: 'text-emerald-700' },
            { min: 60, label: 'Strong', bar: 'bg-green-500', text: 'text-green-600' },
            { min: 40, label: 'Fair', bar: 'bg-amber-500', text: 'text-amber-600' },
            { min: 0, label: 'Weak', bar: 'bg-red-500', text: 'text-red-600' }
        ];

        const BAR_CLASSES = ['bg-emerald-600', 'bg-green-500', 'bg-amber-500', 'bg-red-500', 'bg-gray-300'];

        function showStrength(entropy) {
            if (entropy === null || !isFinite(entropy)) {
                strengthBar.style.width = '0%';
                strengthBar.classList.remove(...BAR_CLASSES);
                strengthBar.classList.add('bg-gray-300');
                strengthLabel.textContent = '';
                strengthLabel.className = 'text-xs font-medium text-gray-500 whitespace-nowrap';
                return;
            }

            const bits = Math.round(entropy);
            const level = STRENGTH_LEVELS.find((entry) => bits >= entry.min);

            strengthBar.style.width = Math.min(100, (bits / 100) * 100) + '%';
            strengthBar.classList.remove(...BAR_CLASSES);
            strengthBar.classList.add(level.bar);

            strengthLabel.textContent = level.label + ' · ~' + bits + ' bits';
            strengthLabel.className = 'text-xs font-medium whitespace-nowrap ' + level.text;
        }

        function showSentence(sentence) {
            if (!sentence) {
                mnemonicHint.classList.add('hidden');
                mnemonicSentence.textContent = '';
                return;
            }
            mnemonicSentence.textContent = sentence;
            mnemonicHint.classList.remove('hidden');
        }

        /* ------------------------------------------------------------------
         * Clipboard
         * ------------------------------------------------------------------ */
        function copyToClipboard() {
            const password = passwordOutput.textContent;

            if (!password || password === 'Generate a password') {
                showCopyFeedback('Nothing to copy', false);
                return;
            }

            if (!navigator.clipboard) {
                showCopyFeedback('Clipboard not available', false);
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                showCopyFeedback('Copied to clipboard', true);
                copyBtn.innerHTML = ICON_CHECK;
                setTimeout(() => {
                    copyBtn.innerHTML = ICON_COPY;
                }, 2000);
            }).catch((err) => {
                showCopyFeedback('Failed to copy', false);
                console.error('Failed to copy password:', err);
            });
        }

        function showCopyFeedback(message, isSuccess) {
            copyFeedback.textContent = message;
            copyFeedback.className = 'text-sm h-5 text-center ' + (isSuccess ? 'text-green-600' : 'text-red-600');

            setTimeout(() => {
                copyFeedback.textContent = '';
            }, 2000);
        }

        /* ------------------------------------------------------------------
         * Boot
         * ------------------------------------------------------------------ */
        setupServiceWorker();
        initEventListeners();
        generatePassword();
    </script>
</body>
</html>
