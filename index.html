    <link rel="icon" href="icons/icon-192.png">

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="ios-card w-full max-w-md rounded-2xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-500 to-blue-600 p-5 text-white">
            <h1 class="text-2xl font-semibold">Password Generator</h1>

        <!-- Password Output -->
        <div class="p-5 border-b border-gray-100">
            <div class="flex items-center justify-between bg-gray-50 rounded-xl p-4 mb-3 border border-gray-200">
                <div class="password-display text-lg font-medium overflow-x-auto whitespace-nowrap" id="password-output" aria-live="polite">Generate a password</div>
                <button id="copy-btn" type="button" aria-label="Copy password to clipboard" class="text-blue-500 hover:text-blue-600 transition-colors p-1 rounded-full hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
            </div>

            <!-- Strength estimate -->
            <div class="flex items-center gap-3 mb-1">
                <div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">

            </div>
            <div id="copy-feedback" class="text-sm text-green-600 h-5 text-center" role="status" aria-live="polite"></div>
        </div>

        <!-- Generation Options -->
        <div class="p-5 space-y-5">
            <!-- Type Selector -->
            <div class="bg-gray-50 rounded-xl p-1">
                <div class="grid grid-cols-2 gap-1 mb-1">
                    <button id="random-btn" type="button" aria-pressed="true" class="px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2 bg-white shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/></svg> Random
                    </button>
                    <button id="syllable-btn" type="button" aria-pressed="false" class="px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2 text-gray-500 hover:text-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8.8 20v-4.1l1.9.2a2.3 2.3 0 0 0 2.164-2.1V8.3A5.37 5.37 0 0 0 2 8.25c0 2.8.656 3.054 1 4.55a5.77 5.77 0 0 1 .029 2.758L2 20"/><path d="M19.8 17.8a7.5 7.5 0 0 0 .003-10.603"/><path d="M17 15a3.5 3.5 0 0 0-.025-4.975"/></svg> Syllable
                    </button>
                </div>
                <div class="grid grid-cols-1">
                    <button id="passphrase-btn" type="button" aria-pressed="false" class="px-4 py-2 rounded-lg font-medium text-sm transition-colors flex items-center gap-2 text-gray-500 hover:text-gray-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg> Passphrase
                    </button>
                </div>
            </div>

            <!-- Random Password Settings -->
            <div id="random-settings" class="space-y-4">
                <!-- Length Slider -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="length-slider" class="text-sm font-medium text-gray-700">Password Length</label>
                        <span class="text-sm font-medium text-gray-900" id="length-value">16</span>
                    </div>
                    <input type="range" id="length-slider" min="6" max="64" value="16" class="slider-thumb w-full h-1 bg-gray-200 rounded-full appearance-none cursor-pointer">
                </div>

                <!-- Character Types -->
                <div class="space-y-2">
                    <label class="text-sm font-medium text-gray-700">Character Types</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <span class="text-gray-700">A-Z</span>
                            <input type="checkbox" id="uppercase" class="toggle-checkbox h-5 w-9 rounded-full appearance-none bg-gray-300 checked:bg-blue-500 transition-colors duration-200 ease-in-out border border-transparent" checked>
                        </label>
                        <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <span class="text-gray-700">a-z</span>
                            <input type="checkbox" id="lowercase" class="toggle-checkbox h-5 w-9 rounded-full appearance-none bg-gray-300 checked:bg-blue-500 transition-colors duration-200 ease-in-out border border-transparent" checked>
                        </label>
                        <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <span class="text-gray-700">0-9</span>
                            <input type="checkbox" id="numbers" class="toggle-checkbox h-5 w-9 rounded-full appearance-none bg-gray-300 checked:bg-blue-500 transition-colors duration-200 ease-in-out border border-transparent" checked>
                        </label>
                        <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                            <span class="text-gray-700">!@#$</span>
                            <input type="checkbox" id="symbols" class="toggle-checkbox h-5 w-9 rounded-full appearance-none bg-gray-300 checked:bg-blue-500 transition-colors duration-200 ease-in-out border border-transparent" checked>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Passphrase Settings (hidden initially) -->
            <div id="passphrase-settings" class="space-y-4 hidden">
                <!-- Language -->
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-2 block">Language</label>
                    <!-- sr-only (not hidden) keeps the radios reachable by keyboard -->
                    <div class="flex overflow-hidden rounded-lg border border-gray-200">
                        <label class="flex-1">
                            <input type="radio" name="language" value="english" class="sr-only peer" checked>
                            <div class="p-3 text-center bg-gray-50 peer-checked:bg-blue-500 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-inset peer-focus-visible:ring-blue-500 transition-colors cursor-pointer">
                                English
                            </div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="language" value="german" class="sr-only peer">
                            <div class="p-3 text-center bg-gray-50 peer-checked:bg-blue-500 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-inset peer-focus-visible:ring-blue-500 transition-colors cursor-pointer">
                                German
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Word Count -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="word-count" class="text-sm font-medium text-gray-700">Number of Words</label>
                        <span class="text-sm font-medium text-gray-900" id="word-count-value">6</span>
                    </div>
                    <input type="range" id="word-count" min="3" max="12" value="6" class="slider-thumb w-full h-1 bg-gray-200 rounded-full appearance-none cursor-pointer">
                </div>

                <!-- Separator -->
                <div>
                    <label for="separator" class="text-sm font-medium text-gray-700 mb-2 block">Word Separator</label>
                    <select id="separator" class="w-full p-3 rounded-lg border border-gray-200 bg-gray-50 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="-">Hyphen (-)</option>
                        <option value=" ">Space ( )</option>
                        <option value="_">Underscore (_)</option>
                        <option value=".">Dot (.)</option>
                    </select>
                </div>

                <!-- Add Number -->
                <label class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <span class="text-gray-700">Add random number</span>
                    <input type="checkbox" id="add-number" class="toggle-checkbox h-5 w-9 rounded-full appearance-none bg-gray-300 checked:bg-blue-500 transition-colors duration-200 ease-in-out border border-transparent">
                </label>
            </div>

            <!-- Generate Button -->
            <button id="generate-btn" type="button" class="w-full bg-blue-500 hover:bg-blue-600 disabled:opacity-60 text-white py-3 px-4 rounded-xl font-medium flex items-center justify-center gap-2 active:scale-95 transform transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg> Generate Password
            </button>
        </div>
    </div>

    <!-- Update banner (hidden until a new service worker is waiting) -->
    <div id="update-banner" class="hidden fixed inset-x-0 bottom-0 p-4 flex justify-center" role="status" aria-live="polite">
        <div class="bg-gray-900 text-white text-sm rounded-xl shadow-lg px-4 py-3 flex items-center gap-4 max-w-md w-full">
            <span class="flex-1">A new version is available.</span>
            <button id="update-btn" type="button" class="bg-blue-500 hover:bg-blue-600 px-3 py-1.5 rounded-lg font-medium transition-colors">Update</button>
            <button id="update-dismiss" type="button" class="text-gray-400 hover:text-white transition-colors">Later</button>
        </div>
    </div>

    <script>
        'use strict';

        /* ------------------------------------------------------------------
         * Service worker registration + update flow
         * ------------------------------------------------------------------ */
        const updateBanner = document.getElementById('update-banner');
        const updateBtn = document.getElementById('update-btn');
        const updateDismiss = document.getElementById('update-dismiss');

        function setupServiceWorker() {
            if (!('serviceWorker' in navigator)) return;

            // Relative path: keeps the app working under a sub-path such as
            // https://user.github.io/pwgen/ where '/sw.js' would 404.
            navigator.serviceWorker.register('sw.js').then((registration) => {
                let waitingWorker = registration.waiting || null;

                function promptForUpdate(worker) {
                    waitingWorker = worker;
                    updateBanner.classList.remove('hidden');
                }

                // A worker may already be waiting from a previous visit.
                if (registration.waiting && navigator.serviceWorker.controller) {
                    promptForUpdate(registration.waiting);
                }

                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    if (!newWorker) return;
                    newWorker.addEventListener('statechange', () => {
                        // controller check: on a first-ever install there is
                        // nothing to update *from*, so stay silent.
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            promptForUpdate(newWorker);
                        }
                    });
                });

                updateBtn.addEventListener('click', () => {
                    updateBanner.classList.add('hidden');
                    // Without this the new worker stays in 'waiting' forever and
                    // a plain reload would change nothing.
                    if (waitingWorker) waitingWorker.postMessage({ type: 'SKIP_WAITING' });
                });

                updateDismiss.addEventListener('click', () => {
                    updateBanner.classList.add('hidden');
                });
            }).catch((err) => {
                console.warn('ServiceWorker registration failed:', err);
            });

            // The new worker took over -> reload once to pick up the new assets.
            let reloading = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (reloading) return;
                reloading = true;
                window.location.reload();
            });
        }

        /* ------------------------------------------------------------------
         * Cryptographically secure randomness
         *
         * Math.random() is a non-cryptographic PRNG whose internal state can be
         * recovered from a handful of outputs - unusable for secrets.
         * ------------------------------------------------------------------ */
        const cryptoObj = window.crypto || window.msCrypto;
        const hasSecureRandom = !!(cryptoObj && typeof cryptoObj.getRandomValues === 'function');

        // Uniform integer in [0, max) via rejection sampling (no modulo bias).
        function randomInt(max) {
            if (!Number.isInteger(max) || max < 1 || max > 0x100000000) {
                throw new RangeError('randomInt: max out of range');
            }
            const buf = new Uint32Array(1);
            // Largest multiple of `max` that fits in a uint32; anything at or
            // above it would over-represent the low values, so we resample.
            const limit = Math.floor(0x100000000 / max) * max;
            let value;
            do {
                cryptoObj.getRandomValues(buf);
                value = buf[0];
            } while (value >= limit);
            return value % max;
        }

        function randomChar(chars) {
            return chars.charAt(randomInt(chars.length));
        }

        function randomItem(list) {
            return list[randomInt(list.length)];
        }

        // Fisher-Yates with a CSPRNG source.
        function shuffleString(str) {
            const array = str.split('');
            for (let i = array.length - 1; i > 0; i--) {
                const j = randomInt(i + 1);
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array.join('');
        }

        /* ------------------------------------------------------------------
         * Word lists (Diceware, 7776 words = 12.92 bits per word)
         * ------------------------------------------------------------------ */
        const WORDLIST_URLS = {
            english: 'words/en.txt',
            german: 'words/de.txt'
        };
        const wordListCache = {};

        async function loadWordList(language) {
            if (wordListCache[language]) return wordListCache[language];

            const response = await fetch(WORDLIST_URLS[language]);
            if (!response.ok) {
                throw new Error('Could not load the word list');
            }
            const words = (await response.text())
                .split('\n')
                .map((word) => word.trim())
                .filter(Boolean);

            if (words.length < 1000) {
                throw new Error('Word list looks incomplete');
            }
            wordListCache[language] = words;
            return words;
        }

        /* ------------------------------------------------------------------
         * Character pools
         * ------------------------------------------------------------------ */
        const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
        const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const DIGITS = '0123456789';
        const SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';

        const syllablePatterns = ['CV', 'VC', 'CVC', 'CV', 'VC', 'CVC', 'CV', 'VC'];
        const consonants = 'bcdfghjklmnpqrstvwxyz';
        const vowels = 'aeiou';

        /* ------------------------------------------------------------------
         * Icons (inline SVG - no runtime icon library, works offline)
         * ------------------------------------------------------------------ */
        const ICON_REFRESH = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>';
        const ICON_LOADER = '<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
        const ICON_COPY = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>';
        const ICON_CHECK = '<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg>';

        /* ------------------------------------------------------------------
         * DOM elements
         * ------------------------------------------------------------------ */
        const passwordOutput = document.getElementById('password-output');
        const copyBtn = document.getElementById('copy-btn');
        const copyFeedback = document.getElementById('copy-feedback');
        const strengthBar = document.getElementById('strength-bar');
        const strengthLabel = document.getElementById('strength-label');
        const generateBtn = document.getElementById('generate-btn');
        const randomBtn = document.getElementById('random-btn');
        const syllableBtn = document.getElementById('syllable-btn');
        const passphraseBtn = document.getElementById('passphrase-btn');
        const randomSettings = document.getElementById('random-settings');
        const passphraseSettings = document.getElementById('passphrase-settings');

        const lengthSlider = document.getElementById('length-slider');
        const lengthValue = document.getElementById('length-value');
        const uppercaseCheck = document.getElementById('uppercase');
        const lowercaseCheck = document.getElementById('lowercase');
        const numbersCheck = document.getElementById('numbers');
        const symbolsCheck = document.getElementById('symbols');
        const wordCountSlider = document.getElementById('word-count');
        const wordCountValue = document.getElementById('word-count-value');
        const separatorSelect = document.getElementById('separator');
        const addNumberCheck = document.getElementById('add-number');
        const languageRadios = document.querySelectorAll('input[name="language"]');

        let currentGenerationType = 'random';

        /* ------------------------------------------------------------------
         * Mode switching
         * ------------------------------------------------------------------ */
        const modeButtons = {
            random: randomBtn,
            syllable: syllableBtn,
            passphrase: passphraseBtn
        };

        function selectMode(mode) {
            currentGenerationType = mode;

            Object.keys(modeButtons).forEach((name) => {
                const button = modeButtons[name];
                const active = name === mode;
                button.setAttribute('aria-pressed', String(active));
                if (active) {
                    button.classList.remove('text-gray-500', 'hover:text-gray-700');
                    button.classList.add('bg-white', 'shadow-sm');
                } else {
                    button.classList.remove('bg-white', 'shadow-sm');
                    button.classList.add('text-gray-500', 'hover:text-gray-700');
                }
            });

            randomSettings.classList.toggle('hidden', mode === 'passphrase');
            passphraseSettings.classList.toggle('hidden', mode !== 'passphrase');
        }

        function initEventListeners() {
            lengthSlider.addEventListener('input', () => {
                lengthValue.textContent = lengthSlider.value;
            });

            wordCountSlider.addEventListener('input', () => {
                wordCountValue.textContent = wordCountSlider.value;
            });

            Object.keys(modeButtons).forEach((mode) => {
                modeButtons[mode].addEventListener('click', () => selectMode(mode));
            });

            generateBtn.addEventListener('click', generatePassword);
            copyBtn.addEventListener('click', copyToClipboard);

            selectMode('random');
        }

        /* ------------------------------------------------------------------
         * Generation
         * ------------------------------------------------------------------ */
        async function generatePassword() {
            if (!hasSecureRandom) {
                passwordOutput.textContent = 'Secure randomness unavailable in this browser';
                showStrength(null);
                return;
            }

            generateBtn.disabled = true;
            generateBtn.innerHTML = ICON_LOADER + ' Generating...';

            try {
                let result;
                switch (currentGenerationType) {
                    case 'syllable':
                        result = generateSyllablePassword();
                        break;
                    case 'passphrase':
                        result = await generatePassphrase();
                        break;
                    default:
                        result = generateRandomPassword();
                }
                passwordOutput.textContent = result.password;
                showStrength(result.entropy);
            } catch (error) {
                passwordOutput.textContent = error.message;
                copyFeedback.textContent = '';
                showStrength(null);
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = ICON_REFRESH + ' Generate Password';
            }
        }

        function generateRandomPassword() {
            const length = parseInt(lengthSlider.value, 10);

            const selectedTypes = [
                uppercaseCheck.checked ? UPPERCASE : '',
                lowercaseCheck.checked ? LOWERCASE : '',
                numbersCheck.checked ? DIGITS : '',
                symbolsCheck.checked ? SYMBOLS : ''
            ].filter(Boolean);

            if (selectedTypes.length === 0) {
                throw new Error('Please select at least one character type');
            }

            const charset = selectedTypes.join('');
            let password = '';

            // One character from every selected type, then fill up.
            selectedTypes.forEach((type) => {
                password += randomChar(type);
            });
            for (let i = password.length; i < length; i++) {
                password += randomChar(charset);
            }

            return {
                password: shuffleString(password),
                entropy: password.length * Math.log2(charset.length)
            };
        }

        function generateSyllablePassword() {
            const length = parseInt(lengthSlider.value, 10);
            const useNumbers = numbersCheck.checked;
            const useSymbols = symbolsCheck.checked;
            const useUppercase = uppercaseCheck.checked;

            let substitutions = 0;
            let substitutionPool = 0;

            let password = '';
            while (password.length < length) {
                const pattern = randomItem(syllablePatterns);
                let syllable = '';

                for (const char of pattern) {
                    if (char === 'C') {
                        syllable += randomChar(consonants);
                    } else if (char === 'V') {
                        syllable += randomChar(vowels);
                    }
                }

                if (useUppercase && randomInt(10) < 3) {
                    syllable = syllable.charAt(0).toUpperCase() + syllable.slice(1);
                }

                password += syllable;
            }

            password = password.substring(0, length);

            if (useNumbers || useSymbols) {
                let pool = '';
                if (useNumbers) pool += DIGITS;
                if (useSymbols) pool += SYMBOLS;

                // Pick the positions up front from the lowercase letters that are
                // actually present, so this can never spin looking for a slot.
                const candidates = [];
                for (let i = 0; i < password.length; i++) {
                    if (/[a-z]/.test(password.charAt(i))) candidates.push(i);
                }

                const wanted = Math.min(Math.floor(length * 0.2), candidates.length);
                for (let i = candidates.length - 1; i > 0; i--) {
                    const j = randomInt(i + 1);
                    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
                }

                const chars = password.split('');
                for (let i = 0; i < wanted; i++) {
                    chars[candidates[i]] = randomChar(pool);
                }
                password = chars.join('');

                substitutions = wanted;
                substitutionPool = pool.length;
            }

            return {
                password: password,
                entropy: syllableEntropy(password.length, useUppercase, substitutions, substitutionPool)
            };
        }

        async function generatePassphrase() {
            const wordCount = parseInt(wordCountSlider.value, 10);
            const separator = separatorSelect.value;
            const addNumber = addNumberCheck.checked;

            let selectedLanguage = 'english';
            for (const radio of languageRadios) {
                if (radio.checked) {
                    selectedLanguage = radio.value;
                    break;
                }
            }

            const words = await loadWordList(selectedLanguage);
            const parts = [];
            for (let i = 0; i < wordCount; i++) {
                parts.push(randomItem(words));
            }

            if (addNumber) {
                parts.push(String(randomInt(90) + 10));
            }

            return {
                password: parts.join(separator),
                entropy: wordCount * Math.log2(words.length) + (addNumber ? Math.log2(90) : 0)
            };
        }

        /* ------------------------------------------------------------------
         * Strength estimate
         *
         * Entropy of the *generation process*, i.e. how much work an attacker
         * who knows this exact algorithm and all its settings has to do. That
         * is the honest number - it is not a guess based on the characters
         * that happened to come out.
         * ------------------------------------------------------------------ */
        function log2Choose(n, k) {
            // log2 of the binomial coefficient, computed additively to avoid
            // overflow for the larger lengths.
            let bits = 0;
            for (let i = 1; i <= k; i++) {
                bits += Math.log2(n - k + i) - Math.log2(i);
            }
            return bits;
        }

        // Bits contributed per character by the syllable scheme, derived from
        // the pattern table so it stays correct if the table changes.
        function syllableBitsPerChar(useUppercase) {
            const counts = {};
            syllablePatterns.forEach((pattern) => {
                counts[pattern] = (counts[pattern] || 0) + 1;
            });

            const total = syllablePatterns.length;
            let patternEntropy = 0;
            let meanLength = 0;
            let meanCharBits = 0;

            Object.keys(counts).forEach((pattern) => {
                const probability = counts[pattern] / total;
                patternEntropy -= probability * Math.log2(probability);
                meanLength += probability * pattern.length;

                let bits = 0;
                for (const char of pattern) {
                    bits += char === 'C' ? Math.log2(consonants.length) : Math.log2(vowels.length);
                }
                meanCharBits += probability * bits;
            });

            let perSyllable = patternEntropy + meanCharBits;
            if (useUppercase) {
                // One 30/70 coin flip per syllable.
                perSyllable += -(0.3 * Math.log2(0.3) + 0.7 * Math.log2(0.7));
            }
            return perSyllable / meanLength;
        }

        function syllableEntropy(length, useUppercase, substitutions, poolSize) {
            const bitsPerChar = syllableBitsPerChar(useUppercase);
            let bits = length * bitsPerChar;

            if (substitutions > 0 && poolSize > 0) {
                // Which positions were replaced, and by what - minus what the
                // overwritten letters used to contribute.
                bits += log2Choose(length, substitutions);
                bits += substitutions * Math.log2(poolSize);
                bits -= substitutions * bitsPerChar;
            }
            return Math.max(0, bits);
        }

        const STRENGTH_LEVELS = [
            { min: 80, label: 'Very strong', bar: 'bg-emerald-600', text: 'text-emerald-700' },
            { min: 60, label: 'Strong', bar: 'bg-green-500', text: 'text-green-600' },
            { min: 40, label: 'Fair', bar: 'bg-amber-500', text: 'text-amber-600' },
            { min: 0, label: 'Weak', bar: 'bg-red-500', text: 'text-red-600' }
        ];

        const BAR_CLASSES = ['bg-emerald-600', 'bg-green-500', 'bg-amber-500', 'bg-red-500', 'bg-gray-300'];

        function showStrength(entropy) {
            if (entropy === null || !isFinite(entropy)) {
                strengthBar.style.width = '0%';
                strengthBar.classList.remove(...BAR_CLASSES);
                strengthBar.classList.add('bg-gray-300');
                strengthLabel.textContent = '';
                strengthLabel.className = 'text-xs font-medium text-gray-500 whitespace-nowrap';
                return;
            }

            const bits = Math.round(entropy);
            const level = STRENGTH_LEVELS.find((entry) => bits >= entry.min);

            strengthBar.style.width = Math.min(100, (bits / 100) * 100) + '%';
            strengthBar.classList.remove(...BAR_CLASSES);
            strengthBar.classList.add(level.bar);

            strengthLabel.textContent = level.label + ' · ~' + bits + ' bits';
            strengthLabel.className = 'text-xs font-medium whitespace-nowrap ' + level.text;
        }

        /* ------------------------------------------------------------------
         * Clipboard
         * ------------------------------------------------------------------ */
        function copyToClipboard() {
            const password = passwordOutput.textContent;

            if (!password || password === 'Generate a password') {
                showCopyFeedback('Nothing to copy', false);
                return;
            }

            if (!navigator.clipboard) {
                showCopyFeedback('Clipboard not available', false);
                return;
            }

            navigator.clipboard.writeText(password).then(() => {
                showCopyFeedback('Copied to clipboard', true);
                copyBtn.innerHTML = ICON_CHECK;
                setTimeout(() => {
                    copyBtn.innerHTML = ICON_COPY;
                }, 2000);
            }).catch((err) => {
                showCopyFeedback('Failed to copy', false);
                console.error('Failed to copy password:', err);
            });
        }

        function showCopyFeedback(message, isSuccess) {
            copyFeedback.textContent = message;
            copyFeedback.className = 'text-sm h-5 text-center ' + (isSuccess ? 'text-green-600' : 'text-red-600');

            setTimeout(() => {
                copyFeedback.textContent = '';
            }, 2000);
        }

        /* ------------------------------------------------------------------
         * Boot
         * ------------------------------------------------------------------ */
        setupServiceWorker();
        initEventListeners();
        generatePassword();
    </script>
</body>
</html>
