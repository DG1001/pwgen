name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      # Only the files the browser actually needs. Keeps the 1.5 MB icon
      # source, the build config and node_modules out of the published site.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html manifest.json sw.js _site/
          cp -r assets icons words _site/

      - name: Verify the build is complete
        run: |
          for f in index.html manifest.json sw.js assets/app.css \
                   assets/fonts/inter-latin.woff2 words/en.txt words/de.txt \
                   icons/icon-192.png icons/icon-512.png icons/icon-maskable.png; do
            test -s "_site/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          # Every asset the service worker precaches must exist, or install fails.
          for asset in $(grep -oE "'\./[^']*'" sw.js | tr -d "'" | sed 's|^\./||' | sort -u); do
            test -e "_site/$asset" || { echo "service worker precaches a missing file: $asset"; exit 1; }
          done

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          token: ${{ secrets.DEPLOY_TOKEN }}
